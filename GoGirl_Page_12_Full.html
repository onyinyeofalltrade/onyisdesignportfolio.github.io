<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500&display=swap');

:root {
  --ivory: #F8F6F2;
  --charcoal: #252525;
  --gold: #C7A468;
  --stone: #D7CEC3;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #ccc;
  font-family: 'Inter', sans-serif;
  padding: 40px;
  display: flex;
  justify-content: center;
}

.page {
  width: 1200px;
  height: 1600px;
  background: var(--ivory);
  position: relative;
  overflow: hidden;
  box-shadow: 0 8px 40px rgba(0,0,0,0.15);
  display: flex;
  flex-direction: column;
}

.photo-wrap {
  width: 100%;
  height: 62%;
  position: relative;
  overflow: hidden;
}
.photo-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: 60% 40%;
  display: block;
}
.page-number {
  position: absolute;
  top: 48px;
  right: 56px;
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ivory);
  opacity: 0.9;
}

.text-panel {
  flex: 1;
  padding: 64px 80px 60px 80px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  position: relative;
}
.eyebrow {
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 26px;
  display: flex;
  align-items: center;
  gap: 14px;
}
.eyebrow::after {
  content: "";
  height: 0.5px;
  width: 44px;
  background: var(--gold);
}

.lines {
  font-family: 'Fraunces', serif;
  font-weight: 400;
  font-size: 30px;
  line-height: 1.45;
  color: var(--charcoal);
  max-width: 640px;
}
.lines .soft { opacity: 0.55; display: block; }
.lines .land { display: block; margin-top: 6px; }

.footer {
  position: absolute;
  bottom: 56px;
  left: 80px;
  right: 80px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 11px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--charcoal);
  opacity: 0.35;
}
</style>
</head>
