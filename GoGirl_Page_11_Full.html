<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500&display=swap');

:root {
  --ivory: #F8F6F2;
  --charcoal: #252525;
  --gold: #C7A468;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #ccc;
  font-family: 'Inter', sans-serif;
  padding: 40px;
  display: flex;
  justify-content: center;
}

.page {
  width: 1200px;
  height: 1600px;
  background: var(--ivory);
  position: relative;
  overflow: hidden;
  box-shadow: 0 8px 40px rgba(0,0,0,0.15);
}

.page img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: 45% 50%;
  display: block;
}

.page-number {
  position: absolute;
  top: 56px;
  right: 64px;
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--charcoal);
  opacity: 0.7;
}

.headline-block {
  position: absolute;
  top: 110px;
  left: 64px;
  right: 260px;
}
.eyebrow {
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 22px;
}
.headline {
  font-family: 'Fraunces', serif;
  font-weight: 400;
  font-size: 72px;
  line-height: 1.08;
  color: var(--charcoal);
}

.caption-block {
  position: absolute;
  bottom: 64px;
  left: 64px;
  right: 64px;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
}
.caption {
  font-size: 13px;
  letter-spacing: 0.02em;
  color: var(--charcoal);
  max-width: 340px;
  line-height: 1.6;
  background: rgba(248,246,242,0.88);
  padding: 14px 18px;
}
.mark {
  font-family: 'Fraunces', serif;
  font-size: 15px;
  letter-spacing: 0.15em;
  color: var(--charcoal);
  background: rgba(248,246,242,0.88);
  padding: 10px 16px;
}
</style>
</head>
